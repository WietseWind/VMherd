<!doctype html>
<!-- One Mac App Store screenshot: headline + app capture (+ optional zoom lens). Rendered at
     1440x900 CSS px with device scale 2 (= 2880x1800) by tools/store-shots/make.py; the scene
     comes in the URL hash as JSON. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Barlow"; font-weight: 500; src: url("../../assets/fonts/BarlowSemiCondensed-Medium.ttf"); }
@font-face { font-family: "Barlow"; font-weight: 700; src: url("../../assets/fonts/BarlowSemiCondensed-Bold.ttf"); }
@font-face { font-family: "Mono"; font-weight: 400; src: url("../../assets/fonts/JetBrainsMono-Regular.ttf"); }
@font-face { font-family: "Mono"; font-weight: 700; src: url("../../assets/fonts/JetBrainsMono-Bold.ttf"); }
:root {
  --bg: #0a0c0b;
  --text: #e8ece9;
  --soft: #9aa39e;
  --line: #262c29;
  --green: #3ddc84;
  --amber: #f5b53d;
  --red: #ff5a52;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1440px; height: 900px; overflow: hidden; background: var(--bg); }
body {
  position: relative;
  color: var(--text);
  font-family: "Barlow", sans-serif;
  background:
    radial-gradient(900px 520px at 12% -8%, rgba(61, 220, 132, 0.16), transparent 70%),
    radial-gradient(700px 500px at 100% 110%, rgba(61, 220, 132, 0.08), transparent 70%),
    repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.028) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.028) 0 1px, transparent 1px 40px),
    var(--bg);
}
.head { position: absolute; left: 130px; top: 46px; width: 1180px; }
.eyebrow {
  font: 700 15px/1 "Mono", monospace;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--green);
}
.eyebrow .n { color: var(--soft); margin-right: 12px; }
h1 {
  margin-top: 16px;
  font-weight: 700;
  font-size: 60px;
  line-height: 1;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
h1 em { font-style: normal; color: var(--green); }
.sub {
  margin-top: 14px;
  font-weight: 500;
  font-size: 22px;
  line-height: 1.3;
  color: var(--soft);
  white-space: nowrap;
}
.sub code, .chip code { font-family: "Mono", monospace; color: var(--text); font-size: 0.86em; }
.chips { position: absolute; right: 130px; top: 38px; display: flex; gap: 10px; }
.chip {
  padding: 7px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(18, 21, 19, 0.85);
  font: 400 14px/1 "Mono", monospace;
  color: var(--soft);
  white-space: nowrap;
}
.chip::before { content: "● "; color: var(--green); }
.shot {
  position: absolute;
  left: 130px;
  top: 212px;
  width: 1180px;
  height: 737.5px;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid #2c332f;
  box-shadow: 0 40px 90px rgba(0, 0, 0, 0.65), 0 0 0 6px rgba(61, 220, 132, 0.05);
}
.shot img { display: block; width: 100%; height: 100%; }
.mark {
  position: absolute;
  border: 2px solid var(--green);
  border-radius: 8px;
  box-shadow: 0 0 0 4px rgba(61, 220, 132, 0.18);
}
.lens {
  position: absolute;
  overflow: hidden;
  border: 2px solid var(--green);
  border-radius: 14px;
  background-repeat: no-repeat;
  box-shadow: 0 30px 70px rgba(0, 0, 0, 0.75), 0 0 0 8px rgba(61, 220, 132, 0.12);
}
.lens .tag {
  position: absolute;
  left: 0;
  bottom: 0;
  padding: 7px 12px;
  border-top-right-radius: 10px;
  background: var(--green);
  color: #06140c;
  font: 700 15px/1 "Mono", monospace;
}
svg.wire { position: absolute; inset: 0; width: 1440px; height: 900px; pointer-events: none; }
</style>
</head>
<body>
<div class="head">
  <p class="eyebrow"><span class="n"></span><span class="e"></span></p>
  <h1></h1>
  <p class="sub"></p>
</div>
<div class="chips"></div>
<div class="shot"><img alt=""></div>
<script>
const s = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const esc = (t) => t.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
// *green*, `code`, and \n line breaks
const rich = (t) => esc(t).replace(/\*(.+?)\*/g, "<em>$1</em>").replace(/`(.+?)`/g, "<code>$1</code>").replace(/\n/g, "<br>");
document.querySelector(".eyebrow .n").textContent = s.n;
document.querySelector(".eyebrow .e").textContent = s.eyebrow;
document.querySelector("h1").innerHTML = rich(s.title);
document.querySelector(".sub").innerHTML = rich(s.sub);
for (const c of s.chips || []) {
  const el = document.createElement("span");
  el.className = "chip";
  el.innerHTML = rich(c);
  document.querySelector(".chips").append(el);
}
const img = document.querySelector(".shot img");
img.src = s.shot;
// raw capture px -> page px
const shot = { x: 130, y: 212, w: 1180, rawW: 2880 };
const k = shot.w / shot.rawW;
if (s.lens) {
  const [rx, ry, rw, rh] = s.lens.src; // region in raw capture px
  const mark = document.createElement("div");
  mark.className = "mark";
  const mx = shot.x + rx * k, my = shot.y + ry * k, mw = rw * k, mh = rh * k;
  Object.assign(mark.style, { left: `${mx - 4}px`, top: `${my - 4}px`, width: `${mw + 8}px`, height: `${mh + 8}px` });
  document.body.append(mark);
  const z = s.lens.scale; // page px per raw px inside the lens
  const [lx, ly] = s.lens.at;
  const lw = rw * z, lh = rh * z;
  const lens = document.createElement("div");
  lens.className = "lens";
  Object.assign(lens.style, {
    left: `${lx}px`, top: `${ly}px`, width: `${lw}px`, height: `${lh}px`,
    backgroundImage: `url("${s.shot}")`,
    backgroundSize: `${shot.rawW * z}px auto`,
    backgroundPosition: `${-rx * z}px ${-ry * z}px`,
  });
  if (s.lens.tag) {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = s.lens.tag;
    lens.append(tag);
  }
  // wire from the marked region to the lens
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "wire");
  const a = { x: mx + mw / 2, y: my + mh / 2 };
  const b = { x: lx + lw / 2, y: ly + lh / 2 };
  svg.innerHTML = `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#3ddc84" stroke-width="2" stroke-dasharray="6 6" opacity="0.8"/>`;
  document.body.append(svg, lens);
}
</script>
</body>
</html>
