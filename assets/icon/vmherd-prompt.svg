<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- VMherd app icon: a herd of consoles. Source of all generated icon files (tools/make-icons.sh). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2620"/>
      <stop offset="1" stop-color="#090c0a"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.5" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#3ee27f" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#3ee27f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6faf7"/>
      <stop offset="1" stop-color="#bfd2c6"/>
    </linearGradient>
    <linearGradient id="woolBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d9185"/>
      <stop offset="1" stop-color="#3f4d44"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b2014" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132019"/>
      <stop offset="1" stop-color="#070a08"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="2"/>
    </pattern>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="190"/>
    </clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <!-- one sheep, facing left, body centred at 0,0 -->
    <g id="wool-shape">
      <circle cx="-150" cy="5" r="112"/>
      <circle cx="-62" cy="-62" r="122"/>
      <circle cx="62" cy="-66" r="122"/>
      <circle cx="160" cy="-4" r="112"/>
      <circle cx="98" cy="72" r="108"/>
      <circle cx="-30" cy="84" r="112"/>
      <circle cx="-150" cy="76" r="92"/>
      <circle cx="0" cy="8" r="150"/>
    </g>
    <clipPath id="woolClip">
      <circle cx="-150" cy="5" r="112"/>
      <circle cx="-62" cy="-62" r="122"/>
      <circle cx="62" cy="-66" r="122"/>
      <circle cx="160" cy="-4" r="112"/>
      <circle cx="98" cy="72" r="108"/>
      <circle cx="-30" cy="84" r="112"/>
      <circle cx="-150" cy="76" r="92"/>
      <circle cx="0" cy="8" r="150"/>
    </clipPath>
    <g id="legs">
      <rect x="-138" y="120" width="40" height="118" rx="20"/>
      <rect x="-62" y="138" width="40" height="112" rx="20"/>
      <rect x="40" y="138" width="40" height="112" rx="20"/>
      <rect x="116" y="120" width="40" height="118" rx="20"/>
    </g>
  </defs>

  <!-- tile -->
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#grid)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#haze)"/>

    <!-- the herd behind: dimmer, same prompt (in sync) -->
    <g transform="translate(452 334) scale(0.5)">
      <use href="#legs" fill="#1a241e"/>
      <g clip-path="url(#woolClip)"><rect x="-300" y="-230" width="620" height="470" fill="url(#woolBack)"/></g>
      <rect x="-352" y="-104" width="222" height="196" rx="46" fill="url(#screen)" stroke="#2fae66" stroke-width="16"/>
      <path d="M-306 -34 L-256 -2 L-306 30" fill="none" stroke="#2fae66" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-240" y="22" width="62" height="20" rx="6" fill="#2fae66"/>
    </g>
    <g transform="translate(748 392) scale(0.54)">
      <use href="#legs" fill="#1a241e"/>
      <g clip-path="url(#woolClip)" opacity="0.9"><rect x="-300" y="-230" width="620" height="470" fill="url(#woolBack)"/></g>
      <rect x="-352" y="-104" width="222" height="196" rx="46" fill="url(#screen)" stroke="#279257" stroke-width="16"/>
      <path d="M-306 -34 L-256 -2 L-306 30" fill="none" stroke="#279257" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-240" y="22" width="62" height="20" rx="6" fill="#279257"/>
    </g>

    <!-- ground shadow of the lead sheep -->
    <ellipse cx="560" cy="846" rx="270" ry="30" fill="#000" opacity="0.45" filter="url(#soft)"/>

    <!-- the lead sheep -->
    <g transform="translate(604 616)">
      <use href="#legs" fill="#2a3830" stroke="#0a0e0b" stroke-width="6"/>
      <g clip-path="url(#woolClip)">
        <rect x="-300" y="-230" width="620" height="470" fill="url(#wool)"/>
        <rect x="-300" y="-230" width="620" height="470" fill="url(#shade)"/>
      </g>
      <!-- ear with the red ON AIR tag -->
      <ellipse cx="-118" cy="-164" rx="72" ry="29" transform="rotate(-40 -118 -164)" fill="#2d3e34" stroke="#0a0e0b" stroke-width="7"/>
      <ellipse cx="-112" cy="-170" rx="42" ry="11" transform="rotate(-40 -112 -170)" fill="#41584a"/>
      <circle cx="-74" cy="-206" r="25" fill="#ff3d3d" stroke="#7a1b1b" stroke-width="4" filter="url(#glow)"/>
      <rect x="-406" y="-130" width="300" height="262" rx="60" fill="#000" opacity="0.38" filter="url(#soft)"/>
      <!-- face = console -->
      <rect x="-420" y="-150" width="300" height="262" rx="60" fill="url(#screen)" stroke="#3ee27f" stroke-width="16" filter="url(#glow)"/>
      <path d="M-361 -59 L-291 -14 L-361 30" fill="none" stroke="#3ee27f" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      <rect x="-269" y="19" width="87" height="28" rx="8" fill="#3ee27f" filter="url(#glow)"/>
    </g>
  </g>
  <!-- rim -->
  <rect x="101" y="101" width="822" height="822" rx="189" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
</svg>
