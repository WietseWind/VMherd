[package]
name = "vmherd"
description = "VMherd: many Proxmox VM consoles in one grid, with one keyboard for all of them"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "vmherd"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Mac App Store build (tools/package-mas.sh): App Sandbox, no child processes, so only the Keychain
# for token secrets (no "existing Keychain item" or "command" source), no --screenshot, launch
# arguments never exit the app, and the App Store license text in About.
mas = []
# `--scene NAME --out FILE`: scripted App Store screenshots of the demo. Development only: release
# and App Store builds never enable it.
store-shots = []

[dependencies]
rfb.workspace = true
pve.workspace = true
demo.workspace = true
eframe.workspace = true
egui.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
keyring-core.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
clap.workspace = true
url.workspace = true
image.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
