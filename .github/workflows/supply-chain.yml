# Supply-chain checks with cargo-deny (deny.toml): RustSec advisories (known vulnerable, unsound or
# yanked crates), crate sources (crates.io only: no git or unknown registries), licenses, and banned
# patterns. Runs on every change to the dependency set and daily, because new advisories appear
# while the code stays the same.
name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, "bans licenses sources"]
    # a new advisory must not block unrelated pull requests; it still fails the daily run and pushes to main
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}

  lockfile:
    name: Cargo.lock is up to date and used
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The lockfile matches Cargo.toml (no silent dependency changes)
        run: cargo metadata --locked --format-version 1 > /dev/null
