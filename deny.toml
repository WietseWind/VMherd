# cargo-deny: supply-chain checks (run in CI on every push/PR and daily).
#   advisories: RustSec vulnerability / unsound / yanked-crate database
#   sources:    crates only from crates.io, no git or other registries
#   licenses:   only the licenses VMherd may ship (same list as about.toml)
#   bans:       wildcard versions forbidden, duplicate versions reported
[graph]
targets = [
    "aarch64-apple-darwin", "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
version = 2
allow = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "0BSD",
    "ISC", "Zlib", "Unicode-3.0", "BSL-1.0", "CC0-1.0", "Unlicense", "MPL-2.0",
    "OFL-1.1", "Ubuntu-font-1.0",
]
confidence-threshold = 0.9
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
